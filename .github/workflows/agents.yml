name: agents

on:
  schedule:
    - cron: "30 23 * * 1-5"   # อังคาร–เสาร์ 06:30 เวลาไทย (หลังตลาดสหรัฐปิด) → daily
    - cron: "0 2 * * 6"       # เสาร์ 09:00 เวลาไทย → weekly (สร้างแพ็กเกจ) + backtest
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | backtest"
        default: weekly

concurrency:
  group: agents          # ห้ามรันซ้อนกัน
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # ขอ OIDC token ให้ Worker ตรวจว่าเป็น repo นี้จริง (ไม่ต้องใช้ secret)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKER_URL: https://us-stock-agent.tevez7549.workers.dev
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run agents
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 2 * * 6" ]; then MODE=weekly; else MODE=daily; fi
          fi
          echo "mode=$MODE"
          if [ "$MODE" = "weekly" ]; then
            python orchestrator.py weekly
            python orchestrator.py backtest
          else
            python orchestrator.py "$MODE"
          fi
