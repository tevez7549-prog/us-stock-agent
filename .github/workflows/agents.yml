name: agents

on:
  # ไม่ใช้ schedule ของ GitHub (ไม่เคยรันตามเวลา และ 06:30 ไทย Yahoo ยังไม่มีราคาปิด)
  # ตัวเฝ้าระวังบน Cloudflare Worker (cron) สั่งรันแทน: รายวัน อังคาร–เสาร์ ~10:30, รายสัปดาห์ เสาร์ ~11:00
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | backtest"
        default: weekly

concurrency:
  group: agents          # ห้ามรันซ้อนกัน
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # ขอ OIDC token ให้ Worker ตรวจว่าเป็น repo นี้จริง (ไม่ต้องใช้ secret)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WORKER_URL: https://us-stock-agent.tevez7549.workers.dev
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # อีเมลผู้ติดต่อ SEC (secret ไม่โชว์ใน log)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agents.txt
      - run: pip install -r requirements-agents.txt
      - name: Run agents
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 2 * * 6" ]; then MODE=weekly; else MODE=daily; fi
          fi
          echo "mode=$MODE"
          if [ "$MODE" = "weekly" ]; then
            python orchestrator.py weekly
            python orchestrator.py backtest
          else
            python orchestrator.py "$MODE"
          fi
