name: research

# งานวิจัยแบบสั่งรันเอง (ไม่กระทบพอร์ต) ผลเก็บใน D1 shared state ตามที่สคริปต์กำหนด
on:
  workflow_dispatch:
    inputs:
      script:
        description: "โมดูลใน research/ เช่น random_baseline"
        default: random_baseline

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORKER_URL: https://us-stock-agent.tevez7549.workers.dev
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agents.txt
      - run: pip install -r requirements-agents.txt lxml
      - run: python -m research.${{ github.event.inputs.script }}
