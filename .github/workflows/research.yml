name: research

# งานวิจัยแบบสั่งรันเอง (ไม่กระทบพอร์ต) ผลเก็บใน D1 shared state ตามที่สคริปต์กำหนด
on:
  workflow_dispatch:
    inputs:
      script:
        description: "โมดูลใน research/ เช่น random_baseline"
        default: random_baseline
      only:
        description: "ตัวแปร ONLY (เช่น W1,W2,W3) ว่าง = ทั้งหมด"
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORKER_URL: https://us-stock-agent.tevez7549.workers.dev
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # อีเมลผู้ติดต่อ SEC (secret ไม่โชว์ใน log)
      TZ: Asia/Bangkok
      ONLY: ${{ github.event.inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agents.txt
      - run: pip install -r requirements-agents.txt lxml
      - run: python -m research.${{ github.event.inputs.script }}
